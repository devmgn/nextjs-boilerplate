name: Skills Update

on:
  schedule:
    # Every Monday at 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # Queue later runs so this one is not cancelled while pushing the PR branch
  cancel-in-progress: false

permissions: {}

# skills-lock.json holds only hashes, not versions, so Renovate cannot track it.
# Re-fetch with `mise run skills:update` and open a PR if there is a diff.
#
# Do not give write permissions to the job that runs third-party code (the skills CLI and fetched skills).
# Hand the diff over as a patch; the job with write permissions only applies it and opens the PR.
jobs:
  Update:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install skills CLI
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node npm:skills

      # If unset, it tries to install every tool in mise.toml, so run with only what mise-action installed
      - name: Update skills
        run: mise run --skip-tools skills:update

      - name: Create patch
        run: |
          git add -A -- skills-lock.json .claude/skills
          git diff --cached --binary > "$RUNNER_TEMP/skills.patch"

      - name: Upload patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skills-patch
          path: ${{ runner.temp }}/skills.patch
          retention-days: 1
          if-no-files-found: error

  PullRequest:
    needs: Update
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Holds the GitHub App credentials; restrict its deployment branches to main
    environment: bot
    # The PR is pushed and opened with the App token below, so GITHUB_TOKEN stays read-only
    permissions:
      contents: read
    steps:
      # Pushes made with GITHUB_TOKEN do not trigger workflows, and dispatched ci.yml runs do not
      # satisfy the PR's required status checks. Push as a GitHub App so ci.yml runs on `push`.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skills-patch
          path: ${{ runner.temp }}

      # Pass even an empty patch to create-pull-request so it closes the PR when upstream matches main again
      - name: Apply patch
        run: |
          if [ -s "$RUNNER_TEMP/skills.patch" ]; then
            git apply --include='skills-lock.json' --include='.claude/skills/*' "$RUNNER_TEMP/skills.patch"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-agent-skills
          delete-branch: true
          add-paths: |
            skills-lock.json
            .claude/skills/**
          commit-message: "chore: update agent skills"
          title: "chore: update agent skills"
          body: |
            Automated update via `mise run skills:update`.

            Review the upstream changes to the vendored skills before merging.

name: Actions Lint

on:
  push:
    paths:
      - ".github/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ActionsLint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: actionlint aqua:zizmorcore/zizmor

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor .github/
        env:
          # Used for online audits (impostor-commit, etc.)
          GH_TOKEN: ${{ github.token }}

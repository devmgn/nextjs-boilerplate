name: Actions Lint

on:
  push:
    paths:
      - ".github/**"
      - "mise.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ActionsLint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: actionlint aqua:zizmorcore/zizmor

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor .github/
        env:
          # online audits（impostor-commit など）に使う
          GH_TOKEN: ${{ github.token }}

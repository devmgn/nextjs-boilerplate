name: Lint

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor は自リポジトリ参照に `$/` 構文を推奨するが、actionlint 1.7.12
      # （現時点の最新）が未知の形式として弾くため `./` のまま据え置く。
      # actionlint が対応したら ignore を外して `$/.github/actions/setup` へ移行する。
      - name: Setup Project
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Check
        run: pnpm check

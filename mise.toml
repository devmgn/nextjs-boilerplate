[tools]
"aqua:zizmorcore/zizmor" = "1.31.1"
actionlint = "1.7.12"
node = "26.13.0"
"npm:skills" = "1.7.4"
pnpm = "12.16.1"

[vars]
skills_add = "skills add -a claude-code -y"
vercel_skills = "vercel-react-best-practices vercel-composition-patterns vercel-react-view-transitions web-design-guidelines"
react_doctor_skills = "react-doctor improve-react"

[tasks."lint:workflows"]
description = "GitHub Actions lint (actionlint + zizmor)"
# Run sequentially: depends runs tasks in parallel, and one failing aborts the other
run = [{ task = "lint:actionlint" }, { task = "lint:zizmor" }]

[tasks."lint:actionlint"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint -color"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions security with zizmor"
run = "zizmor .github/"

[tasks."skills:update"]
description = "Re-fetch the GitHub-sourced skills (skills-lock.json) into .claude/skills"
# Disable telemetry to skills.sh
env = { DO_NOT_TRACK = "1" }
# --skill is variadic, so keep it last
run = [
  "{{vars.skills_add}} vercel-labs/agent-skills --skill {{vars.vercel_skills}}",
  "{{vars.skills_add}} millionco/react-doctor --skill {{vars.react_doctor_skills}}",
  "{{vars.skills_add}} orval-labs/orval --skill orval",
]
